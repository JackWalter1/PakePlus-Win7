name: Build

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            version:
                description: '版本号 (例如: 1.0.0)'
                required: false
                default: '0.0.1'
            build_macos_arm64:
                description: 'Build for macOS arm64 (Apple Silicon)'
                required: false
                type: boolean
                default: false
            build_macos_x64:
                description: 'Build for macOS x86_64 (Intel)'
                required: false
                type: boolean
                default: false
            build_linux_x86_64:
                description: 'Build for Linux x64'
                required: false
                type: boolean
                default: false
            build_linux_arm64:
                description: 'Build for Linux arm64'
                required: false
                type: boolean
                default: false
            build_windows_x86_64:
                description: 'Build for Windows x64'
                required: false
                type: boolean
                default: false
            build_windows_arm64:
                description: 'Build for Windows arm64'
                required: false
                type: boolean
                default: false

permissions:
    contents: write

jobs:
    prepare:
        name: Select platforms
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.set.outputs.matrix }}
        steps:
            - name: Build target matrix
              id: set
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  BUILD_MACOS_ARM64: ${{ github.event.inputs.build_macos_arm64 }}
                  BUILD_MACOS_X64: ${{ github.event.inputs.build_macos_x64 }}
                  BUILD_LINUX_X86_64: ${{ github.event.inputs.build_linux_x86_64 }}
                  BUILD_LINUX_ARM64: ${{ github.event.inputs.build_linux_arm64 }}
                  BUILD_WINDOWS_X86_64: ${{ github.event.inputs.build_windows_x86_64 }}
                  BUILD_WINDOWS_ARM64: ${{ github.event.inputs.build_windows_arm64 }}
              run: |
                  set -euo pipefail
                  matrix='[]'

                  add() {
                    matrix=$(jq -c \
                      --arg label "$1" \
                      --arg os "$2" \
                      --arg script "$3" \
                      --arg arch "$4" \
                      --arg artifact "$5" \
                      --arg glob "$6" \
                      --arg use_system_fpm "$7" \
                      '. + [{label:$label, os:$os, script:$script, arch:$arch, artifact:$artifact, glob:$glob, use_system_fpm:$use_system_fpm}]' \
                      <<<"$matrix")
                  }

                  # Tag pushes keep the existing Windows x64 release build.
                  # workflow_dispatch builds only the platforms selected in the form.
                  if [[ "$EVENT_NAME" == "push" || "$BUILD_WINDOWS_X86_64" == "true" ]]; then
                    add "Windows x64" "windows-latest" "build:win" "x64" "windows-x64" "dist/*.exe" "false"
                  fi
                  if [[ "$BUILD_WINDOWS_ARM64" == "true" ]]; then
                    add "Windows arm64" "windows-latest" "build:win" "arm64" "windows-arm64" "dist/*.exe" "false"
                  fi
                  if [[ "$BUILD_MACOS_ARM64" == "true" ]]; then
                    add "macOS arm64" "macos-latest" "build:mac" "arm64" "macos-arm64" "dist/*.dmg" "false"
                  fi
                  if [[ "$BUILD_MACOS_X64" == "true" ]]; then
                    add "macOS x64" "macos-latest" "build:mac" "x64" "macos-x64" "dist/*.dmg" "false"
                  fi
                  # upload-artifact does not expand brace globs such as *.{AppImage,deb}.
                  linux_glob=$(printf '%s\n' 'dist/*.AppImage' 'dist/*.deb')
                  if [[ "$BUILD_LINUX_X86_64" == "true" ]]; then
                    add "Linux x64" "ubuntu-latest" "build:linux" "x64" "linux-x64" "$linux_glob" "false"
                  fi
                  if [[ "$BUILD_LINUX_ARM64" == "true" ]]; then
                    add "Linux arm64" "ubuntu-24.04-arm" "build:linux" "arm64" "linux-arm64" "$linux_glob" "true"
                  fi

                  echo "Selected targets:"
                  echo "$matrix" | jq .

                  if [[ "$(jq 'length' <<<"$matrix")" -eq 0 ]]; then
                    echo "::error::No platform selected. Enable at least one build_* input."
                    exit 1
                  fi

                  {
                    echo "matrix<<EOF"
                    echo "$matrix"
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"

    build:
        name: ${{ matrix.label }}
        needs: prepare
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJson(needs.prepare.outputs.matrix) }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '18'
                  cache: 'npm'

            - name: Install Linux packaging tools
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

            - name: Install system fpm
              if: matrix.use_system_fpm == 'true'
              run: |
                  sudo apt-get install -y ruby ruby-dev build-essential
                  sudo gem install --no-document fpm
                  fpm --version

            - name: Install dependencies
              run: npm ci

            - name: Run worker
              run: node scripts/ppworker.cjs

            - name: Build ${{ matrix.label }}
              run: npm run ${{ matrix.script }} -- --${{ matrix.arch }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CSC_IDENTITY_AUTO_DISCOVERY: false
                  USE_SYSTEM_FPM: ${{ matrix.use_system_fpm }}

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.artifact }}
                  path: ${{ matrix.glob }}
                  retention-days: 30
                  if-no-files-found: error

    release:
        needs: build
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

        permissions:
            contents: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Get version number
              id: version
              run: |
                  if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
                    echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
                  else
                    VERSION=$(node -p "require('./package.json').version")
                    echo "version=$VERSION" >> $GITHUB_OUTPUT
                  fi

            - name: Download all build artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts
                  pattern: '*'

            - name: List downloaded file structure
              run: |
                  echo "=== 文件结构 ==="
                  find artifacts -type f | sort
                  echo "=== 文件详情 ==="
                  find artifacts -type d -exec ls -la {} \;

            - name: Rename files (prefix with branch or tag name)
              run: |
                  PREFIX="${{ github.ref_name }}"

                  echo "使用前缀: $PREFIX"

                  find artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" \) | while read -r file; do
                    dir=$(dirname "$file")
                    base=$(basename "$file")

                    if [[ "$base" != "$PREFIX-"* ]]; then
                      new_file="$dir/$PREFIX-$base"
                      mv "$file" "$new_file"
                      echo "重命名: $file -> $new_file"
                    fi
                  done

            - name: Create Release
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ github.ref_name }}
                  name: Release v${{ steps.version.outputs.version }}
                  body: |
                      ## 多平台版本发布 v${{ steps.version.outputs.version }}

                      按所选平台自动构建。标签推送默认构建 Windows x64；手动运行可勾选以下平台：

                      - macOS arm64 (Apple Silicon) / macOS x64 (Intel)
                      - Linux x64 / Linux arm64
                      - Windows x64 / Windows arm64

                      ### 文件说明
                      - `*setup.exe`: Windows 安装程序
                      - `*.exe` (非 setup): Windows 便携版本
                      - `*.dmg`: macOS 安装包
                      - `*.AppImage` / `*.deb`: Linux 安装包

                      ### 系统要求
                      - Windows 7 或更高版本
                      - 请根据系统与架构选择对应的文件
                  files: |
                      artifacts/**/*.exe
                      artifacts/**/*.dmg
                      artifacts/**/*.AppImage
                      artifacts/**/*.deb
                  draft: false
                  prerelease: false
