<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Electron Tab Browser</title>
        <style>
            * {
                box-sizing: border-box;
            }
            :root {
                --chrome-strip: #dee1e6;
                --chrome-strip-darker: #d3d7dd;
                --chrome-tab: #ffffff;
                --chrome-tab-hover: #cfd3d9;
                --chrome-toolbar: #ffffff;
                --chrome-text: #202124;
                --chrome-muted: #5f6368;
                --chrome-curve: 10px;
            }
            body {
                margin: 0;
                display: flex;
                flex-direction: column;
                height: 100vh;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                    'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei',
                    sans-serif;
                color: var(--chrome-text);
                background: var(--chrome-strip);
                -webkit-font-smoothing: antialiased;
            }
            #chrome-header {
                flex-shrink: 0;
                background: var(--chrome-strip);
            }
            #tab-bar {
                height: 40px;
                min-height: 40px;
                padding: 6px 8px 0;
                display: flex;
                align-items: flex-end;
                gap: 6px;
                background: var(--chrome-strip);
                overflow: hidden;
            }
            .toolbar-buttons {
                display: flex;
                align-items: center;
                gap: 2px;
                height: 32px;
                padding: 0 8px 0 2px;
                margin-bottom: 0;
                flex-shrink: 0;
                border-right: 1px solid #c4c7ce;
            }
            .toolbar-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 5px;
                height: 28px;
                padding: 0 10px;
                border: none;
                border-radius: 14px;
                background: transparent;
                color: var(--chrome-muted);
                font-size: 12px;
                font-weight: 500;
                font-family: inherit;
                line-height: 1;
                cursor: pointer;
                transition: background 0.12s ease, color 0.12s ease,
                    transform 0.08s ease;
                -webkit-tap-highlight-color: transparent;
                user-select: none;
            }
            .toolbar-btn svg {
                width: 14px;
                height: 14px;
                flex-shrink: 0;
            }
            .toolbar-btn:hover {
                background: rgba(255, 255, 255, 0.55);
                color: var(--chrome-text);
            }
            .toolbar-btn:active {
                background: rgba(255, 255, 255, 0.75);
                transform: scale(0.97);
            }
            .toolbar-btn.exit-btn {
                color: #c5221f;
            }
            .toolbar-btn.exit-btn:hover {
                background: #fce8e6;
                color: #a50e0e;
            }
            #tabs-container {
                display: flex;
                align-items: flex-end;
                flex: 1;
                min-width: 0;
                height: 100%;
                overflow-x: auto;
                overflow-y: hidden;
                scrollbar-width: none;
            }
            #tabs-container::-webkit-scrollbar {
                display: none;
            }
            .tab {
                position: relative;
                display: flex;
                align-items: center;
                height: 32px;
                min-width: 72px;
                max-width: 220px;
                width: 180px;
                flex: 1 1 180px;
                padding: 0 12px 0 14px;
                margin: 0;
                cursor: pointer;
                color: var(--chrome-muted);
                font-size: 12px;
                font-weight: 500;
                z-index: 1;
                -webkit-tap-highlight-color: transparent;
                user-select: none;
            }
            .tab::before {
                content: '';
                position: absolute;
                inset: 0;
                border-radius: 10px 10px 0 0;
                background: transparent;
                z-index: -1;
            }
            .tab:hover:not(.active)::before {
                background: var(--chrome-tab-hover);
            }
            /* 非激活标签之间的细分隔线 */
            .tab:not(.active):not(:hover) .tab-divider {
                position: absolute;
                right: 0;
                top: 8px;
                bottom: 8px;
                width: 1px;
                background: #aeb3ba;
                z-index: 2;
            }
            .tab.active + .tab .tab-divider,
            .tab:hover + .tab .tab-divider,
            .tab:hover .tab-divider,
            /* 最后一个标签左侧（即倒数第二个标签右侧）不要分割线 */
            .tab:nth-last-child(2) .tab-divider,
            .tab:last-child .tab-divider {
                display: none;
            }
            .tab.active {
                z-index: 3;
                color: var(--chrome-text);
            }
            .tab.active::before {
                background: var(--chrome-tab);
            }
            /* Chrome 式左右凹角 */
            .tab-curve-left,
            .tab-curve-right {
                display: none;
                position: absolute;
                bottom: 0;
                width: var(--chrome-curve);
                height: var(--chrome-curve);
                pointer-events: none;
                z-index: 0;
            }
            .tab.active .tab-curve-left,
            .tab.active .tab-curve-right {
                display: block;
            }
            .tab.active .tab-curve-left {
                left: calc(var(--chrome-curve) * -1);
                background: radial-gradient(
                    circle at 0 0,
                    transparent var(--chrome-curve),
                    var(--chrome-tab) calc(var(--chrome-curve) + 0.5px)
                );
            }
            .tab.active .tab-curve-right {
                right: calc(var(--chrome-curve) * -1);
                background: radial-gradient(
                    circle at 100% 0,
                    transparent var(--chrome-curve),
                    var(--chrome-tab) calc(var(--chrome-curve) + 0.5px)
                );
            }
            .tab-title {
                flex: 1;
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                padding-right: 4px;
            }
            .close-btn {
                display: none;
                align-items: center;
                justify-content: center;
                width: 18px;
                height: 18px;
                margin-left: 2px;
                border-radius: 50%;
                font-weight: 500;
                font-size: 14px;
                line-height: 1;
                cursor: pointer;
                color: var(--chrome-muted);
                background: transparent;
                flex-shrink: 0;
            }
            .tab:hover .close-btn,
            .tab.active .close-btn {
                display: inline-flex;
            }
            .close-btn:hover {
                background: #dadce0;
                color: var(--chrome-text);
            }
            #tab-content {
                flex-grow: 1;
                position: relative;
                background: #fff;
            }
            .tab-webview {
                width: 100%;
                height: 100%;
                position: absolute;
                top: 0;
                left: 0;
                display: none;
            }
            .tab-webview.active {
                display: flex;
            }
            /* 密码输入框样式 */
            #password-dialog {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                z-index: 1000;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }

            .passwordContainer {
                background: white;
                padding: 30px;
                width: 400px;
                border-radius: 10px;
                box-shadow: 0 0 10px 0 rgba(0, 0, 0, 0.1);
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 10px;
                border: 1px solid #ccc;
            }

            .password-dialog-title {
                font-size: 20px;
                font-weight: bold;
                margin-bottom: 20px;
                color: #333;
                text-align: center;
            }
            .password-dialog-input {
                margin-bottom: 20px;
            }
            .password-dialog-error-message {
                color: #f44336;
                font-size: 12px;
                margin-top: 5px;
                min-height: 18px;
                display: none;
            }
            .password-dialog-error-message.show {
                display: block;
            }
            .password-dialog-buttons {
                display: flex;
                gap: 10px;
                justify-content: center;
            }
            .password-dialog-buttons button {
                padding: 10px 20px;
                border: none;
                border-radius: 4px;
                font-size: 14px;
                cursor: pointer;
                background-color: #409eff;
                color: white;
                margin-right: 10px;
            }
            #password-input {
                width: 100%;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
                font-size: 14px;
                outline: none;
                box-sizing: border-box;
            }
            #password-input:focus {
                border-color: #4caf50;
            }
            #password-input:hover {
                border-color: #4caf50;
            }
            #password-input:active {
                border-color: #4caf50;
            }
            #password-input:focus {
                border-color: #4caf50;
            }
            #password-input:hover {
                border-color: #4caf50;
            }
            #virtual-keyboard {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                height: 0;
                overflow: hidden;
                z-index: 2000;
                background: #f7f8f9;
                border-top: 1px solid #d1d5da;
            }
            #virtual-keyboard.open {
                height: var(--vk-height);
            }
            #virtual-keyboard-root,
            #virtual-keyboard .zhk {
                width: 100%;
                max-width: none;
                height: 100%;
                min-height: 0;
                border-radius: 0;
                box-shadow: none;
            }
            #virtual-keyboard[data-engine-error]::after {
                content: attr(data-engine-error);
                position: absolute;
                top: 8px;
                left: 12px;
                color: #f44336;
                font-size: 14px;
                z-index: 2;
            }
            :root {
                --vk-height: 280px;
            }
            body.vk-open #tab-content {
                margin-bottom: var(--vk-height);
            }
            body.vk-open #password-dialog {
                padding-bottom: var(--vk-height);
                box-sizing: border-box;
            }
        </style>
    </head>
    <body>
        <div id="chrome-header">
            <div id="tab-bar">
                <div class="toolbar-buttons">
                    <button class="toolbar-btn" id="home-btn" title="主页">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M3 10.5 12 3l9 7.5" />
                            <path d="M5 9.5V21h14V9.5" />
                        </svg>
                        <span>主页</span>
                    </button>
                    <button class="toolbar-btn" id="reload-btn" title="刷新">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M21 12a9 9 0 1 1-2.6-6.4" />
                            <path d="M21 3v6h-6" />
                        </svg>
                        <span>刷新</span>
                    </button>
                    <button class="toolbar-btn exit-btn" id="exit-btn" title="退出">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M10 17H5V7h5" />
                            <path d="M14 12H21" />
                            <path d="M18 9l3 3-3 3" />
                        </svg>
                        <span>退出</span>
                    </button>
                </div>
                <div id="tabs-container"></div>
            </div>
        </div>
        <div id="tab-content"></div>
        <!-- 弹出密码输入框 -->
        <div id="password-dialog" style="display: none">
            <div class="passwordContainer">
                <div class="password-dialog-title">请输入密码以退出应用</div>
                <div class="password-dialog-input">
                    <input
                        type="password"
                        id="password-input"
                        placeholder="请输入密码"
                    />
                    <div
                        class="password-dialog-error-message"
                        id="error-message"
                    >
                        密码错误，请重试
                    </div>
                </div>
                <div class="password-dialog-buttons">
                    <button id="password-confirm-btn">确认</button>
                    <button id="password-cancel-btn">取消</button>
                </div>
            </div>
        </div>
        <div id="virtual-keyboard">
            <div id="virtual-keyboard-root"></div>
        </div>
        <link rel="stylesheet" href="keyboard/dist/zh-keyboard.css" />
        <script src="renderer.js"></script>
        <script type="module" src="keyboard/dist/app.js"></script>
    </body>
</html>
